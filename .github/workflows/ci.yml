name: ci

# CI for the public tapcub/tapcub-ios repository. Contents are pushed as snapshots by `pnpm sdk:sync` in the TapCub main repository;
# version tags (such as 0.1.0, pushed with `--tag ios-v0.1.0`) are what SwiftPM and `pod 'TapCub', :git => …, :tag => …` resolve.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: Swift vectors, adapters, device build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Shared vectors are in test-vectors/sdk; VectorTests finds them automatically
      - run: swift test
      - name: Build for iOS simulator and device
        run: |
          swift build --triple arm64-apple-ios13.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --target TapCub
          swift build --triple arm64-apple-ios13.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --target TapCub
      - name: Podspec version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "s.version *= *'${GITHUB_REF_NAME}'" TapCub.podspec || { echo "::error::TapCub.podspec version != ${GITHUB_REF_NAME}"; exit 1; }
